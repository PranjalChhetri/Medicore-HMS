<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MediCore HMS — Hospital Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/styles.css?v=2"/>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">🏥</div>
      <div>
        <div class="sb-logo-name">Medi<span>Core</span></div>
        <div class="sb-logo-sub">HMS v2.0</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav">
      <div class="sb-sec-title">Main</div>
      <button class="nav-btn active" data-page="dashboard">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-page="patients">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Patients
        <span class="nav-badge" id="nb-patients">0</span>
      </button>
      <button class="nav-btn" data-page="doctors">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 2h8l1 5H7L8 2z"/><path d="M7 7v3a5 5 0 0 0 10 0V7"/><path d="M10 12v5m4-5v5M9 17H7a2 2 0 0 0-2 2v1h14v-1a2 2 0 0 0-2-2h-2"/></svg>
        Doctors
      </button>
      <button class="nav-btn" data-page="appointments">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Appointments
      </button>
      <div class="sb-sec-title">Management</div>
      <button class="nav-btn" data-page="inventory">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Inventory
        <span class="nav-badge" id="nb-inventory" style="display:none">!</span>
      </button>
      <button class="nav-btn" data-page="billing">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Billing
      </button>
      <div class="sb-sec-title">Intelligence</div>
      <button class="nav-btn" data-page="prediction">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.54Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.54Z"/></svg>
        AI Prediction
        <span style="margin-left:auto;background:linear-gradient(135deg,var(--cyan),var(--blue));color:var(--bg);font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px">AI</span>
      </button>
      <button class="nav-btn" data-page="analytics">
        <svg class="ni" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </button>
    </nav>
    <div class="sb-bottom">
      <div class="user-card">
        <div class="user-avatar">PR</div>
        <div>
          <div class="user-name">Pranjal</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard<small>Overview &amp; quick actions</small></div>
      <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="global-search" placeholder="Search patients, doctors..."/>
      </div>
      <button class="icon-btn notif-dot" title="Notifications">🔔</button>
      <button class="icon-btn" title="Settings" onclick="HMS.toast('Settings coming soon','i')">⚙️</button>
    </header>

    <!-- PAGE CONTAINERS -->
    <div class="page-wrap active" id="page-dashboard"></div>
    <div class="page-wrap" id="page-patients"></div>
    <div class="page-wrap" id="page-doctors"></div>
    <div class="page-wrap" id="page-appointments"></div>
    <div class="page-wrap" id="page-inventory"></div>
    <div class="page-wrap" id="page-billing"></div>
    <div class="page-wrap" id="page-prediction"></div>
    <div class="page-wrap" id="page-analytics"></div>    <div class="page-wrap" id="page-settings">
      <div class="settings-container">
        <div class="settings-tabs" id="settings-tabs"></div>
        <div class="settings-content" id="settings-content"></div>
      </div>
    </div>  </main>
</div>

<!-- MODAL OVERLAY -->
<div class="overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<!-- SCRIPTS — order matters -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="static/js/data.js"></script>
<script src="static/js/utils.js"></script>
<script src="static/js/router.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/pages/dashboard.js"></script>
<script src="static/js/pages/patients.js"></script>
<script src="static/js/pages/doctors.js"></script>
<script src="static/js/pages/appointments.js"></script>
<script src="static/js/pages/inventory.js"></script>
<script src="static/js/pages/billing.js"></script>
<script src="static/js/pages/prediction.js"></script>
<script src="static/js/pages/analytics.js"></script>
<script src="static/js/heart-bg.js?v=2"></script>
<script src="static/js/app.js"></script>

</body>
</html>
